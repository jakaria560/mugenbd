      <li><strong>My Hero Academia</strong><span>In a world where most people have special powers, Izuku Midoriya begins as a powerless boy and trains to become a top hero.</span></li>
      <li><strong>One Punch Man</strong><span>Saitama can defeat any enemy with a single punch, and his search for a worthy opponent makes for a funny and exciting parody of superhero stories.</span></li>
      <li><strong>Code Geass</strong><span>An exiled prince gains a mysterious power and leads a rebellion against a powerful empire, using strategy as his main weapon.</span></li>
      <li><strong>Vinland Saga</strong><span>A young Viking warrior searches for meaning and revenge, and slowly discovers what it truly means to live without violence.</span></li>
      <li><strong>Mob Psycho 100</strong><span>A shy middle school boy with huge psychic power tries to live a normal life while learning to manage his emotions.</span></li>
      <li><strong>Your Name</strong><span>Two teenagers who have never met begin swapping bodies, and a touching romance unfolds across time and distance.</span></li>
      <li><strong>A Silent Voice</strong><span>A former bully tries to make amends with a deaf classmate he once hurt, in a gentle story about guilt, forgiveness and friendship.</span></li>
      <li><strong>Spy x Family</strong><span>A spy, an assassin and a telepathic girl pretend to be an ordinary family, and each secretly hides who they really are.</span></li>
      <li><strong>Haikyu!!</strong><span>A short but determined boy joins a high school volleyball team and shows that passion and teamwork can beat natural talent.</span></li>
      <li><strong>Violet Evergarden</strong><span>A former soldier writes letters for other people and slowly learns to understand human feelings in this beautifully animated drama.</span></li>
      <li><strong>Dragon Ball Z</strong><span>Goku and his friends defend Earth against powerful enemies in one of the classic anime that shaped the entire genre.</span></li>
      <li><strong>Bleach</strong><span>Ichigo Kurosaki gains the powers of a Soul Reaper and protects the living from evil spirits while exploring the world of the dead.</span></li>
      <li><strong>Chainsaw Man</strong><span>Denji, a poor young man in heavy debt, merges with a chainsaw devil and joins a group that hunts dangerous devils.</span></li>
      <li><strong>Frieren: Beyond Journey's End</strong><span>After the hero's party defeats the Demon King, an elf mage looks back on her long life and learns to value the short time humans have.</span></li>
      <li><strong>Neon Genesis Evangelion</strong><span>Teenage pilots control giant machines to stop mysterious beings, in a deep and psychological story that changed anime forever.</span></li>
    </ol>

    <p>Every viewer has different tastes, so treat this list as a starting point instead of a strict ranking. Start with one or two titles that sound interesting, and you will probably find your next favorite along the way.</p>

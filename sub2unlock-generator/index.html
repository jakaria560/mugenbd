<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sub4Unlock Link Generator - MugenBD</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f3f6;
  color:#333;
  line-height:1.5;
}


/* =====================================================
   MAIN
===================================================== */

.container{
  width:100%;
  max-width:700px;
  margin:0 auto;
  padding:24px 12px;
}


/* =====================================================
   CARD
===================================================== */

.generator-card{
  width:100%;
  background:#fff;
  border-radius:22px;
  padding:34px 36px 32px;
  box-shadow:0 5px 25px rgba(0,0,0,.06);
}


/* =====================================================
   TITLE
===================================================== */

.title{
  text-align:center;
  color:#173f6b;
  font-size:32px;
  font-weight:700;
  line-height:1.25;
  margin-bottom:38px;
}


/* =====================================================
   FORM
===================================================== */

.form-group{
  margin-bottom:27px;
}

.form-label{
  display:block;
  color:#333;
  font-size:21px;
  font-weight:700;
  line-height:1.35;
  margin-bottom:11px;
}


/* =====================================================
   INPUT
===================================================== */

.form-input{
  display:block;
  width:100%;
  height:72px;

  border:1px solid #cfd4d9;
  border-radius:15px;

  background:#fff;
  color:#444;

  padding:0 22px;

  font-family:Arial,Helvetica,sans-serif;
  font-size:18px;

  outline:none;

  transition:border-color .2s,box-shadow .2s;
}

.form-input::placeholder{
  color:#777;
}

.form-input:focus{
  border-color:#4385d9;
  box-shadow:0 0 0 2px rgba(67,133,217,.08);
}


/* =====================================================
   GENERATE BUTTON
===================================================== */

.generate-btn{
  display:block;
  width:100%;
  height:78px;

  border:0;
  border-radius:15px;

  background:linear-gradient(
    90deg,
    #4b3be6,
    #3487eb
  );

  color:#fff;

  font-family:Arial,Helvetica,sans-serif;
  font-size:22px;
  font-weight:700;

  cursor:pointer;

  box-shadow:0 5px 16px rgba(52,135,235,.15);

  transition:transform .15s;
}

.generate-btn:active{
  transform:scale(.99);
}


/* =====================================================
   ERROR
===================================================== */

.error{
  display:none;

  margin-top:14px;
  padding:10px 13px;

  border:1px solid #ffbcbc;
  border-radius:9px;

  background:#ffeaea;

  color:#c62828;

  font-size:14px;
}


/* =====================================================
   RESULT
===================================================== */

.result-box{
  display:none;

  margin-top:28px;
  padding:22px;

  border:1.5px dashed #1688b6;
  border-radius:16px;

  background:#e3f4ff;
}

.result-title{
  color:#08729c;

  font-size:24px;
  font-weight:700;

  margin-bottom:16px;
}


/* =====================================================
   GENERATED LINK
===================================================== */

.generated-link{
  display:block;

  width:100%;
  min-height:170px;

  resize:none;

  border:1px solid #c6e0ed;
  border-radius:11px;

  background:#fff;

  padding:15px 16px;

  color:#394b59;

  font-family:Arial,Helvetica,sans-serif;
  font-size:16px;
  line-height:1.5;

  outline:none;

  overflow-wrap:anywhere;
  word-break:break-all;
}


/* =====================================================
   COPY
===================================================== */

.copy-btn{
  display:inline-block;

  margin-top:16px;

  border:0;
  border-radius:11px;

  background:#0788c7;

  color:#fff;

  padding:13px 28px;

  font-family:Arial,Helvetica,sans-serif;
  font-size:18px;
  font-weight:700;

  cursor:pointer;
}

.copy-btn:active{
  transform:scale(.98);
}

.copy-btn.copied{
  background:#168a52;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .container{
    padding:18px 10px;
  }

  .generator-card{
    border-radius:20px;
    padding:30px 24px 28px;
  }

  .title{
    font-size:29px;
    margin-bottom:34px;
  }

  .form-group{
    margin-bottom:25px;
  }

  .form-label{
    font-size:19px;
    margin-bottom:10px;
  }

  .form-input{
    height:70px;
    padding:0 20px;
    border-radius:14px;
    font-size:17px;
  }

  .generate-btn{
    height:74px;
    border-radius:14px;
    font-size:21px;
  }

  .result-box{
    margin-top:26px;
    padding:20px;
    border-radius:15px;
  }

  .result-title{
    font-size:22px;
    margin-bottom:15px;
  }

  .generated-link{
    min-height:165px;
    padding:14px;
    font-size:15.5px;
  }

  .copy-btn{
    width:auto;
    padding:12px 25px;
    font-size:17px;
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

  .container{
    padding:15px 8px;
  }

  .generator-card{
    padding:27px 19px 25px;
    border-radius:18px;
  }

  .title{
    font-size:26px;
    margin-bottom:31px;
  }

  .form-label{
    font-size:18px;
  }

  .form-input{
    height:67px;
    font-size:16px;
    padding:0 17px;
  }

  .generate-btn{
    height:70px;
    font-size:20px;
  }

  .result-box{
    padding:17px;
  }

}

</style>

</head>


<body>


<div class="container">

  <div class="generator-card">


    <h1 class="title">
      Sub4Unlock Link Generator
    </h1>


    <!-- YouTube -->

    <div class="form-group">

      <label
        class="form-label"
        for="youtube"
      >
        YouTube Channel Link:
      </label>

      <input
        id="youtube"
        class="form-input"
        type="url"
        value="https://youtube.com/@mugenbd"
        autocomplete="off"
      >

    </div>


    <!-- Telegram -->

    <div class="form-group">

      <label
        class="form-label"
        for="telegram"
      >
        Telegram Link:
      </label>

      <input
        id="telegram"
        class="form-input"
        type="url"
        value="https://t.me/MugenBD"
        autocomplete="off"
      >

    </div>


    <!-- Destination -->

    <div class="form-group">

      <label
        class="form-label"
        for="destination"
      >
        Destination Link (ফাইল বা মূল ডাউনলোড লিংক):
      </label>

      <input
        id="destination"
        class="form-input"
        type="url"
        placeholder="https://drive.google.com/... বা যেকোনো লিংক"
        autocomplete="off"
      >

    </div>


    <!-- Generate -->

    <button
      id="generateBtn"
      class="generate-btn"
      type="button"
    >
      Generate Unlock Link
    </button>


    <!-- Error -->

    <div
      id="error"
      class="error"
    ></div>


    <!-- Result -->

    <div
      id="resultBox"
      class="result-box"
    >

      <div class="result-title">
        Your Generated Link:
      </div>

      <textarea
        id="generatedLink"
        class="generated-link"
        readonly
      ></textarea>

      <button
        id="copyBtn"
        class="copy-btn"
        type="button"
      >
        Copy Link
      </button>

    </div>


  </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const youtubeInput =
  document.getElementById("youtube");

const telegramInput =
  document.getElementById("telegram");

const destinationInput =
  document.getElementById("destination");

const generateBtn =
  document.getElementById("generateBtn");

const resultBox =
  document.getElementById("resultBox");

const generatedLink =
  document.getElementById("generatedLink");

const copyBtn =
  document.getElementById("copyBtn");

const errorBox =
  document.getElementById("error");


/* =====================================================
   ERROR
===================================================== */

function showError(message){

  errorBox.textContent = message;

  errorBox.style.display = "block";

}

function hideError(){

  errorBox.style.display = "none";

}


/* =====================================================
   ENCODE
===================================================== */

function encodeData(data){

  const json =
    JSON.stringify(data);

  const bytes =
    new TextEncoder().encode(json);

  let binary = "";

  bytes.forEach(function(byte){

    binary +=
      String.fromCharCode(byte);

  });

  return btoa(binary);

}


/* =====================================================
   GENERATE
===================================================== */

generateBtn.addEventListener(
  "click",
  function(){

    hideError();


    const youtube =
      youtubeInput.value.trim();

    const telegram =
      telegramInput.value.trim();

    const destination =
      destinationInput.value.trim();


    /* Required */

    if(!youtube){

      showError(
        "Please enter your YouTube Channel link."
      );

      youtubeInput.focus();

      return;

    }


    if(!telegram){

      showError(
        "Please enter your Telegram link."
      );

      telegramInput.focus();

      return;

    }


    if(!destination){

      showError(
        "Please enter your Destination link."
      );

      destinationInput.focus();

      return;

    }


    /* Validate URLs */

    try{

      new URL(youtube);

    }catch{

      showError(
        "Please enter a valid YouTube URL."
      );

      youtubeInput.focus();

      return;

    }


    try{

      new URL(telegram);

    }catch{

      showError(
        "Please enter a valid Telegram URL."
      );

      telegramInput.focus();

      return;

    }


    try{

      new URL(destination);

    }catch{

      showError(
        "Please enter a valid Destination URL."
      );

      destinationInput.focus();

      return;

    }


    /* Data */

    const data = {

      youtube:youtube,

      telegram:telegram,

      destination:destination

    };


    /* Encode */

    const encodedData =
      encodeData(data);


    /* Visitor URL */

    const baseUrl =
      window.location.origin +
      "/sub2unlock/";


    const finalLink =
      baseUrl +
      "?data=" +
      encodeURIComponent(
        encodedData
      );


    /* Show */

    generatedLink.value =
      finalLink;

    resultBox.style.display =
      "block";


    /* Scroll */

    setTimeout(function(){

      resultBox.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },100);

  }
);


/* =====================================================
   COPY
===================================================== */

copyBtn.addEventListener(
  "click",
  async function(){

    const link =
      generatedLink.value.trim();

    if(!link) return;


    try{

      await navigator.clipboard.writeText(
        link
      );

      copyBtn.textContent =
        "✓ Link Copied!";

      copyBtn.classList.add(
        "copied"
      );


      setTimeout(function(){

        copyBtn.textContent =
          "Copy Link";

        copyBtn.classList.remove(
          "copied"
        );

      },2000);


    }catch{

      generatedLink.select();

      document.execCommand(
        "copy"
      );

      copyBtn.textContent =
        "✓ Link Copied!";

      setTimeout(function(){

        copyBtn.textContent =
          "Copy Link";

      },2000);

    }

  }
);

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sub4Unlock Link Generator - MugenBD</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f3f6;
  color:#333;
  line-height:1.4;
}


/* =====================================================
   MAIN
===================================================== */

.container{
  width:100%;
  max-width:610px;
  margin:0 auto;
  padding:18px 8px;
}


/* =====================================================
   CARD
===================================================== */

.generator-card{
  width:100%;
  background:#fff;

  border-radius:19px;

  padding:27px 20px 23px;

  box-shadow:0 5px 20px rgba(0,0,0,.05);
}


/* =====================================================
   TITLE
===================================================== */

.title{
  text-align:center;

  color:#173f6b;

  font-size:24px;
  font-weight:700;

  line-height:1.25;

  margin-bottom:27px;
}


/* =====================================================
   FORM
===================================================== */

.form-group{
  margin-bottom:20px;
}

.form-label{
  display:block;

  color:#333;

  font-size:16px;
  font-weight:700;

  line-height:1.35;

  margin-bottom:8px;
}


/* =====================================================
   INPUT
===================================================== */

.form-input{
  display:block;

  width:100%;
  height:53px;

  border:1px solid #cfd4d9;

  border-radius:11px;

  background:#fff;
  color:#444;

  padding:0 14px;

  font-family:Arial,Helvetica,sans-serif;

  font-size:14px;

  outline:none;

  transition:
    border-color .2s,
    box-shadow .2s;
}

.form-input::placeholder{
  color:#888;
}

.form-input:focus{
  border-color:#4385d9;

  box-shadow:
    0 0 0 2px rgba(67,133,217,.08);
}


/* =====================================================
   GENERATE BUTTON
===================================================== */

.generate-btn{
  display:block;

  width:100%;
  height:55px;

  border:0;

  border-radius:12px;

  background:linear-gradient(
    90deg,
    #4b3be6,
    #3487eb
  );

  color:#fff;

  font-family:Arial,Helvetica,sans-serif;

  font-size:16px;
  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 5px 14px rgba(52,135,235,.12);

  transition:transform .15s;
}

.generate-btn:active{
  transform:scale(.985);
}


/* =====================================================
   ERROR
===================================================== */

.error{
  display:none;

  margin-top:11px;

  padding:9px 11px;

  border:1px solid #ffbcbc;

  border-radius:8px;

  background:#ffeaea;

  color:#c62828;

  font-size:12px;
}


/* =====================================================
   RESULT
===================================================== */

.result-box{
  display:none;

  margin-top:22px;

  padding:17px;

  border:1.5px dashed #1688b6;

  border-radius:14px;

  background:#e3f4ff;
}

.result-title{
  color:#08729c;

  font-size:18px;
  font-weight:700;

  margin-bottom:11px;
}


/* =====================================================
   GENERATED LINK
===================================================== */

.generated-link{
  display:block;

  width:100%;
  min-height:125px;

  resize:none;

  border:1px solid #c6e0ed;

  border-radius:9px;

  background:#fff;

  padding:11px 12px;

  color:#394b59;

  font-family:Arial,Helvetica,sans-serif;

  font-size:12px;

  line-height:1.45;

  outline:none;

  overflow-wrap:anywhere;
  word-break:break-all;
}


/* =====================================================
   COPY
===================================================== */

.copy-btn{
  display:inline-block;

  margin-top:11px;

  border:0;

  border-radius:9px;

  background:#0788c7;

  color:#fff;

  padding:10px 20px;

  font-family:Arial,Helvetica,sans-serif;

  font-size:14px;
  font-weight:700;

  cursor:pointer;

  transition:transform .15s;
}

.copy-btn:active{
  transform:scale(.98);
}

.copy-btn.copied{
  background:#168a52;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .container{
    padding:15px 7px;
  }

  .generator-card{
    border-radius:18px;

    padding:25px 17px 21px;
  }

  .title{
    font-size:22px;

    margin-bottom:24px;
  }

  .form-group{
    margin-bottom:18px;
  }

  .form-label{
    font-size:15px;

    margin-bottom:7px;
  }

  .form-input{
    height:51px;

    padding:0 13px;

    border-radius:10px;

    font-size:14px;
  }

  .generate-btn{
    height:53px;

    border-radius:11px;

    font-size:15px;
  }

  .result-box{
    margin-top:20px;

    padding:15px;

    border-radius:13px;
  }

  .result-title{
    font-size:17px;

    margin-bottom:10px;
  }

  .generated-link{
    min-height:115px;

    padding:10px;

    font-size:11.5px;
  }

  .copy-btn{
    margin-top:10px;

    padding:9px 18px;

    font-size:13px;
  }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media(max-width:380px){

  .container{
    padding:13px 6px;
  }

  .generator-card{
    padding:23px 15px 19px;

    border-radius:17px;
  }

  .title{
    font-size:21px;

    margin-bottom:22px;
  }

  .form-label{
    font-size:14px;
  }

  .form-input{
    height:49px;

    font-size:13px;
  }

  .generate-btn{
    height:51px;

    font-size:14px;
  }

  .result-box{
    padding:13px;
  }

  .result-title{
    font-size:16px;
  }

}


/* =====================================================
   LANDSCAPE / SHORT SCREEN
===================================================== */

@media(
  max-height:700px
) and (
  max-width:600px
){

  .container{
    padding-top:10px;
    padding-bottom:10px;
  }

  .generator-card{
    padding-top:21px;
    padding-bottom:18px;
  }

  .title{
    margin-bottom:19px;
  }

  .form-group{
    margin-bottom:14px;
  }

}

</style>

</head>


<body>


<div class="container">

  <div class="generator-card">


    <!-- TITLE -->

    <h1 class="title">
      Sub4Unlock Link Generator
    </h1>


    <!-- YOUTUBE -->

    <div class="form-group">

      <label
        class="form-label"
        for="youtube"
      >
        YouTube Channel Link:
      </label>

      <input
        id="youtube"
        class="form-input"
        type="url"
        value="https://youtube.com/@mugenbd"
        autocomplete="off"
      >

    </div>


    <!-- TELEGRAM -->

    <div class="form-group">

      <label
        class="form-label"
        for="telegram"
      >
        Telegram Link:
      </label>

      <input
        id="telegram"
        class="form-input"
        type="url"
        value="https://t.me/MugenBD"
        autocomplete="off"
      >

    </div>


    <!-- DESTINATION -->

    <div class="form-group">

      <label
        class="form-label"
        for="destination"
      >
        Destination Link (ফাইল বা মূল ডাউনলোড লিংক):
      </label>

      <input
        id="destination"
        class="form-input"
        type="url"
        placeholder="https://drive.google.com/... বা যেকোনো লিংক"
        autocomplete="off"
      >

    </div>


    <!-- GENERATE -->

    <button
      id="generateBtn"
      class="generate-btn"
      type="button"
    >
      Generate Unlock Link
    </button>


    <!-- ERROR -->

    <div
      id="error"
      class="error"
    ></div>


    <!-- RESULT -->

    <div
      id="resultBox"
      class="result-box"
    >

      <div class="result-title">
        Your Generated Link:
      </div>

      <textarea
        id="generatedLink"
        class="generated-link"
        readonly
      ></textarea>

      <button
        id="copyBtn"
        class="copy-btn"
        type="button"
      >
        Copy Link
      </button>

    </div>


  </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const youtubeInput =
  document.getElementById("youtube");

const telegramInput =
  document.getElementById("telegram");

const destinationInput =
  document.getElementById("destination");

const generateBtn =
  document.getElementById("generateBtn");

const resultBox =
  document.getElementById("resultBox");

const generatedLink =
  document.getElementById("generatedLink");

const copyBtn =
  document.getElementById("copyBtn");

const errorBox =
  document.getElementById("error");


/* =====================================================
   ERROR
===================================================== */

function showError(message){

  errorBox.textContent = message;

  errorBox.style.display = "block";

}

function hideError(){

  errorBox.style.display = "none";

}


/* =====================================================
   ENCODE DATA
===================================================== */

function encodeData(data){

  const json =
    JSON.stringify(data);

  const bytes =
    new TextEncoder().encode(json);

  let binary = "";

  bytes.forEach(function(byte){

    binary +=
      String.fromCharCode(byte);

  });

  return btoa(binary);

}


/* =====================================================
   GENERATE LINK
===================================================== */

generateBtn.addEventListener(
  "click",
  function(){

    hideError();


    const youtube =
      youtubeInput.value.trim();

    const telegram =
      telegramInput.value.trim();

    const destination =
      destinationInput.value.trim();


    /* -------------------------
       REQUIRED
    ------------------------- */

    if(!youtube){

      showError(
        "Please enter your YouTube Channel link."
      );

      youtubeInput.focus();

      return;

    }


    if(!telegram){

      showError(
        "Please enter your Telegram link."
      );

      telegramInput.focus();

      return;

    }


    if(!destination){

      showError(
        "Please enter your Destination link."
      );

      destinationInput.focus();

      return;

    }


    /* -------------------------
       VALIDATE URLS
    ------------------------- */

    try{

      new URL(youtube);

    }catch{

      showError(
        "Please enter a valid YouTube URL."
      );

      youtubeInput.focus();

      return;

    }


    try{

      new URL(telegram);

    }catch{

      showError(
        "Please enter a valid Telegram URL."
      );

      telegramInput.focus();

      return;

    }


    try{

      new URL(destination);

    }catch{

      showError(
        "Please enter a valid Destination URL."
      );

      destinationInput.focus();

      return;

    }


    /* -------------------------
       DATA
    ------------------------- */

    const data = {

      youtube:youtube,

      telegram:telegram,

      destination:destination

    };


    /* -------------------------
       ENCODE
    ------------------------- */

    const encodedData =
      encodeData(data);


    /* -------------------------
       VISITOR PAGE
    ------------------------- */

    const baseUrl =
      window.location.origin +
      "/sub2unlock/";


    const finalLink =
      baseUrl +
      "?data=" +
      encodeURIComponent(
        encodedData
      );


    /* -------------------------
       SHOW RESULT
    ------------------------- */

    generatedLink.value =
      finalLink;

    resultBox.style.display =
      "block";


    /* -------------------------
       SCROLL TO RESULT
    ------------------------- */

    setTimeout(function(){

      resultBox.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },100);

  }
);


/* =====================================================
   COPY LINK
===================================================== */

copyBtn.addEventListener(
  "click",
  async function(){

    const link =
      generatedLink.value.trim();

    if(!link){
      return;
    }


    try{

      await navigator.clipboard.writeText(
        link
      );

      copyBtn.textContent =
        "✓ Link Copied!";

      copyBtn.classList.add(
        "copied"
      );


      setTimeout(function(){

        copyBtn.textContent =
          "Copy Link";

        copyBtn.classList.remove(
          "copied"
        );

      },2000);


    }catch{

      generatedLink.select();

      document.execCommand(
        "copy"
      );

      copyBtn.textContent =
        "✓ Link Copied!";


      setTimeout(function(){

        copyBtn.textContent =
          "Copy Link";

      },2000);

    }

  }
);

</script>


</body>

</html>

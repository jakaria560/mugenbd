
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a35">
  <title>Generate Link | MugenBD</title>

  <style>
    :root {
      --bg: #101a35;
      --card: #ffffff;
      --accent: #ff4f87;
      --green: #16a765;
      --text: #172033;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #253d70 0, transparent 42%),
        linear-gradient(145deg, #101a35, #080d1c);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 7vw, 42px);
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand h1 span {
      color: #ffb400;
    }

    .brand p {
      margin: 0;
      color: #bdc8df;
      font-size: 14px;
    }

    .card {
      padding: 26px;
      background: var(--card);
      color: var(--text);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .description {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #dce1eb;
      border-radius: 11px;
      outline: none;
      background: #f8faff;
      color: #172033;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #647eea;
      box-shadow: 0 0 0 3px rgba(100, 126, 234, 0.12);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .generate-btn {
      color: white;
      background: linear-gradient(135deg, #ff4f87, #ed3672);
      box-shadow: 0 7px 18px rgba(255, 79, 135, 0.22);
    }

    .result {
      display: none;
      margin-top: 25px;
      padding-top: 22px;
      border-top: 1px solid #e9edf4;
    }

    .result h3 {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 18px;
    }

    .result-url {
      padding: 13px;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
      border: 1px solid #bdebd2;
      border-radius: 10px;
      background: #f0fff6;
      color: #087944;
      font-size: 13px;
      line-height: 1.6;
      user-select: text;
    }

    .copy-btn {
      color: white;
      background: var(--green);
    }

    .open-btn {
      margin-top: 10px;
      color: #273a69;
      background: #edf2ff;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      display: block;
      color: #b42318;
      background: #fff0ee;
    }

    .success {
      display: block;
      color: #087944;
      background: #eafbf1;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #9ba9c5;
      font-size: 12px;
    }

    .footer a {
      color: #ffb400;
      text-decoration: none;
    }

    @media (max-width: 420px) {
      .card {
        padding: 21px 17px;
      }

      .card h2 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="brand">
      <h1>Mugen<span>BD</span> 🔗</h1>
      <p>Simple Link Generator for Your Downloads</p>
    </header>

    <section class="card">
      <h2>🛡️ Generate Link</h2>
      <p class="description">
        Enter your destination URL to create a shareable link.
        Every generated link will use the same article page.
      </p>

      <form id="generatorForm">
        <label for="destinationUrl">Final Destination URL</label>

        <input
          type="url"
          id="destinationUrl"
          placeholder="https://example.com/your-game.apk"
          autocomplete="url"
          inputmode="url"
          required
        >

        <button class="generate-btn" type="submit">
          🛡️ Generate Link
        </button>
      </form>

      <div class="result" id="result">
        <h3>Result: ✔️</h3>

        <div class="result-url" id="generatedUrl"></div>

        <button class="copy-btn" id="copyBtn" type="button">
          ▣ Copy URL
        </button>

        <button class="open-btn" id="openBtn" type="button">
          ↗ Open Generated Link
        </button>

        <div class="message" id="message" role="status"></div>
      </div>
    </section>

    <footer class="footer">
      © <span id="year"></span>
      <a href="https://mugenbd.com/">MugenBD</a>.
      All rights reserved.
    </footer>

  </main>

  <script>
    "use strict";

    const form = document.getElementById("generatorForm");
    const destinationInput = document.getElementById("destinationUrl");
    const result = document.getElementById("result");
    const generatedUrlBox = document.getElementById("generatedUrl");
    const copyBtn = document.getElementById("copyBtn");
    const openBtn = document.getElementById("openBtn");
    const message = document.getElementById("message");

    // The single, fixed article page for every generated link.
    const ARTICLE_PAGE = "https://mugenbd.com/article/index.html";

    let generatedUrl = "";

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const rawUrl = destinationInput.value.trim();

      let destination;

      try {
        destination = new URL(rawUrl);
      } catch {
        showMessage("Please enter a valid destination URL.", "error");
        result.style.display = "block";
        return;
      }

      if (
        destination.protocol !== "https:" &&
        destination.protocol !== "http:"
      ) {
        showMessage("Only HTTP and HTTPS links are allowed.", "error");
        result.style.display = "block";
        return;
      }

      // Pass the destination URL to the same article page.
      const shareUrl = new URL(ARTICLE_PAGE);
      shareUrl.searchParams.set("url", destination.href);

      generatedUrl = shareUrl.href;

      generatedUrlBox.textContent = generatedUrl;
      result.style.display = "block";
      message.className = "message";

      copyBtn.textContent = "▣ Copy URL";

      // Scroll to the result on mobile.
      result.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    });

    copyBtn.addEventListener("click", async function () {
      if (!generatedUrl) return;

      try {
        await navigator.clipboard.writeText(generatedUrl);
        copyBtn.textContent = "✔ Copied!";
        showMessage("Generated link copied successfully!", "success");
      } catch {
        // Fallback for browsers that block clipboard access.
        const textArea = document.createElement("textarea");
        textArea.value = generatedUrl;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.select();

        try {
          const copied = document.execCommand("copy");

          if (copied) {
            copyBtn.textContent = "✔ Copied!";
            showMessage("Generated link copied successfully!", "success");
          } else {
            showMessage(
              "Copy failed. Please select and copy the URL manually.",
              "error"
            );
          }
        } catch {
          showMessage(
            "Copy failed. Please select and copy the URL manually.",
            "error"
          );
        }

        textArea.remove();
      }
    });

    openBtn.addEventListener("click", function () {
      if (!generatedUrl) return;

      window.open(generatedUrl, "_blank", "noopener,noreferrer");
    });
  </script>
</body>
 </html>

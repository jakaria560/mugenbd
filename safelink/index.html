<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Safelink Generator - MugenBD</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6fb;
  color:#222;
  min-height:100vh;
}

.header{
  background:#4052b8;
  color:#fff;
  text-align:center;
  padding:22px 15px;
}

.logo{
  font-size:28px;
  font-weight:700;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  margin-top:25px;
  padding:28px 22px;
  border-radius:14px;
  box-shadow:0 4px 22px rgba(0,0,0,.08);
}

.title{
  text-align:center;
  font-size:27px;
  font-weight:700;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

/* =====================================================
   INPUT
===================================================== */

.label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}

.url-input{
  width:100%;
  padding:14px;
  border:1px solid #d9dce8;
  border-radius:8px;
  outline:none;
  font-size:15px;
  transition:.2s;
}

.url-input:focus{
  border-color:#4052b8;
  box-shadow:
    0 0 0 3px rgba(64,82,184,.1);
}

/* =====================================================
   BUTTON
===================================================== */

.generate-btn{
  width:100%;
  border:none;
  background:#4052b8;
  color:#fff;
  padding:14px;
  border-radius:8px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  margin-top:15px;
}

.generate-btn:hover{
  background:#33439d;
}

/* =====================================================
   RESULT
===================================================== */

.result{
  display:none;
  margin-top:25px;
  padding:18px;
  background:#f8f9ff;
  border:1px solid #e1e5ff;
  border-radius:10px;
}

.result-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:10px;
}

.generated-url{
  width:100%;
  padding:12px;
  border:1px solid #d9dce8;
  border-radius:7px;
  background:#fff;
  font-size:14px;
}

.copy-btn{
  width:100%;
  margin-top:10px;
  border:none;
  background:#222;
  color:#fff;
  padding:12px;
  border-radius:7px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.copy-btn:hover{
  background:#111;
}

/* =====================================================
   ERROR
===================================================== */

.error{
  display:none;
  margin-top:15px;
  color:#c62828;
  background:#fff1f1;
  border:1px solid #ffd5d5;
  padding:12px;
  border-radius:7px;
  font-size:14px;
}

/* =====================================================
   INFO
===================================================== */

.info{
  margin-top:20px;
  color:#777;
  font-size:13px;
  line-height:1.7;
  text-align:center;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .card{
    padding:22px 15px;
  }

  .logo{
    font-size:25px;
  }

  .title{
    font-size:23px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="logo">
    MugenBD 🔗
  </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">

  <div class="card">

    <div class="title">
      Safelink Generator
    </div>

    <div class="subtitle">
      Generate a MugenBD Safelink for your destination URL.
    </div>


    <!-- =================================================
         INPUT
    ================================================= -->

    <label
      class="label"
      for="finalUrl"
    >
      Final URL
    </label>

    <input
      id="finalUrl"
      class="url-input"
      type="url"
      placeholder="https://example.com/your-link"
      autocomplete="off"
    >


    <!-- =================================================
         GENERATE
    ================================================= -->

    <button
      id="generateBtn"
      class="generate-btn"
      type="button"
    >
      Generate Safelink
    </button>


    <!-- =================================================
         ERROR
    ================================================= -->

    <div
      id="error"
      class="error"
    ></div>


    <!-- =================================================
         RESULT
    ================================================= -->

    <div
      id="result"
      class="result"
    >

      <div class="result-title">
        ✅ Safelink Generated
      </div>

      <input
        id="generatedUrl"
        class="generated-url"
        type="text"
        readonly
      >

      <button
        id="copyBtn"
        class="copy-btn"
        type="button"
      >
        Copy Safelink
      </button>

    </div>


    <div class="info">

      Paste your final destination URL above and
      generate a MugenBD Safelink.

    </div>

  </div>

</main>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const finalUrlInput =
  document.getElementById("finalUrl");

const generateBtn =
  document.getElementById("generateBtn");

const generatedUrl =
  document.getElementById("generatedUrl");

const result =
  document.getElementById("result");

const errorBox =
  document.getElementById("error");

const copyBtn =
  document.getElementById("copyBtn");


/* =====================================================
   GENERATE
===================================================== */

generateBtn.addEventListener(
  "click",
  function(){

    const finalUrl =
      finalUrlInput.value.trim();


    /* -----------------------------------------------
       VALIDATION
    ----------------------------------------------- */

    if(!finalUrl){

      showError(
        "Please enter a destination URL."
      );

      return;

    }


    let parsedUrl;


    try{

      parsedUrl =
        new URL(finalUrl);

    }catch{

      showError(
        "Please enter a valid URL."
      );

      return;

    }


    if(
      parsedUrl.protocol !== "http:" &&
      parsedUrl.protocol !== "https:"
    ){

      showError(
        "Only HTTP and HTTPS URLs are allowed."
      );

      return;

    }


    /* -----------------------------------------------
       HIDE ERROR
    ----------------------------------------------- */

    errorBox.style.display =
      "none";


    /* -----------------------------------------------
       CREATE SAFE LINK
    ----------------------------------------------- */

    const encodedUrl =
      encodeURIComponent(finalUrl);


    const baseUrl =
      window.location.origin;


    const safeLink =
      baseUrl +
      "/safelink/?url=" +
      encodedUrl;


    /* -----------------------------------------------
       SHOW RESULT
    ----------------------------------------------- */

    generatedUrl.value =
      safeLink;

    result.style.display =
      "block";


    /* -----------------------------------------------
       SELECT RESULT
    ----------------------------------------------- */

    generatedUrl.focus();

    generatedUrl.select();

  }
);


/* =====================================================
   COPY
===================================================== */

copyBtn.addEventListener(
  "click",
  async function(){

    const value =
      generatedUrl.value;


    try{

      await navigator.clipboard.writeText(
        value
      );

      copyBtn.textContent =
        "✓ Copied!";


      setTimeout(
        function(){

          copyBtn.textContent =
            "Copy Safelink";

        },
        1500
      );

    }catch{

      generatedUrl.focus();

      generatedUrl.select();

      document.execCommand("copy");

      copyBtn.textContent =
        "✓ Copied!";

      setTimeout(
        function(){

          copyBtn.textContent =
            "Copy Safelink";

        },
        1500
      );

    }

  }
);


/* =====================================================
   ERROR FUNCTION
===================================================== */

function showError(message){

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";

  result.style.display =
    "none";

}

</script>


</body>

  </html>

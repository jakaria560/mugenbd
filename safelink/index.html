<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Safelink - MugenBD</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6fb;
  color:#222;
  line-height:1.6;
}

.header{
  background:#4052b8;
  color:#fff;
  text-align:center;
  padding:22px 15px;
}

.logo{
  font-size:28px;
  font-weight:700;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  margin-top:20px;
  padding:25px 20px;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  text-align:center;
}

.title{
  font-size:25px;
  font-weight:700;
  margin-bottom:8px;
}

.subtitle{
  color:#666;
  font-size:14px;
  margin-bottom:20px;
}

/* =====================================================
   AD
===================================================== */

.ad-box{
  width:100%;
  min-height:250px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  margin:20px auto;
}

.ad-inner{
  width:300px;
  max-width:100%;
  min-height:250px;
  overflow:hidden;
}

/* =====================================================
   COUNTDOWN
===================================================== */

.countdown-box{
  margin-top:20px;
  padding:20px;
  background:#f8f9ff;
  border:1px solid #e1e5ff;
  border-radius:12px;
}

.count-text{
  font-size:15px;
  color:#555;
}

.timer{
  font-size:42px;
  font-weight:700;
  color:#4052b8;
  margin:8px 0;
}

/* =====================================================
   BUTTON
===================================================== */

.get-btn{
  border:none;
  background:#4052b8;
  color:#fff;
  font-size:18px;
  font-weight:700;
  padding:13px 30px;
  border-radius:8px;
  cursor:pointer;
  min-width:190px;
  transition:.2s;
}

.get-btn:hover{
  background:#33439d;
}

.get-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* =====================================================
   MESSAGE
===================================================== */

.message{
  margin-top:12px;
  color:#666;
  font-size:13px;
}

.footer-text{
  margin-top:20px;
  color:#777;
  font-size:13px;
  line-height:1.7;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .card{
    padding:22px 15px;
  }

  .logo{
    font-size:25px;
  }

  .title{
    font-size:22px;
  }

  .timer{
    font-size:38px;
  }

  .get-btn{
    width:100%;
    max-width:250px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="logo">
    MugenBD 🔗
  </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">

  <div class="card">

    <div class="title">
      🔐 Safelink
    </div>

    <div class="subtitle">
      Your link is being prepared. Please wait a few seconds.
    </div>


    <!-- =================================================
         ADSTERra 300x250
    ================================================= -->

    <div class="ad-box">

      <div class="ad-inner">

        <script>

        atOptions = {
          'key' : '0dfcd9d1378790bebfaf30f6b4efb71d',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };

        </script>

        <script
          src="https://www.highperformanceformat.com/0dfcd9d1378790bebfaf30f6b4efb71d/invoke.js">
        </script>

      </div>

    </div>


    <!-- =================================================
         COUNTDOWN
    ================================================= -->

    <div class="countdown-box">

      <div class="count-text">
        Please wait
      </div>

      <div
        id="timer"
        class="timer"
      >
        10
      </div>

      <div
        id="status"
        class="message"
      >
        Your link will be ready shortly.
      </div>

    </div>


    <!-- =================================================
         GET LINK
    ================================================= -->

    <div style="margin-top:20px;">

      <button
        id="getLink"
        class="get-btn"
        type="button"
        disabled
      >
        Please wait...
      </button>

    </div>


    <div class="footer-text">

      MugenBD Safelink helps prepare your requested
      destination link before continuing.

    </div>

  </div>

</main>


<script>

/* =====================================================
   GET FINAL URL
===================================================== */

const params =
  new URLSearchParams(window.location.search);

const encodedUrl =
  params.get("url");


/* =====================================================
   ELEMENTS
===================================================== */

const timer =
  document.getElementById("timer");

const status =
  document.getElementById("status");

const getLink =
  document.getElementById("getLink");


/* =====================================================
   DECODE URL
===================================================== */

let finalUrl = null;

try {

  if(encodedUrl){

    finalUrl =
      decodeURIComponent(encodedUrl);

  }

} catch(error){

  finalUrl = null;

}


/* =====================================================
   INVALID LINK
===================================================== */

if(
  !finalUrl ||
  !/^https?:\/\//i.test(finalUrl)
){

  timer.textContent = "—";

  status.textContent =
    "Invalid or missing safelink.";

  getLink.disabled = true;

  getLink.textContent =
    "Invalid Link";

}


/* =====================================================
   VALID LINK
===================================================== */

else{

  let seconds = 10;


  timer.textContent =
    seconds;


  const countdown =
    setInterval(function(){

      seconds--;


      timer.textContent =
        seconds;


      if(seconds <= 0){

        clearInterval(countdown);


        timer.textContent =
          "✓";


        status.textContent =
          "Your link is ready.";


        getLink.disabled =
          false;


        getLink.textContent =
          "Get Link";

      }

    },1000);


  /* ===================================================
     GET LINK
  =================================================== */

  getLink.addEventListener(
    "click",
    function(){

      if(!finalUrl) return;


      /*
       * Replace the current page with
       * the destination URL.
       */

      window.location.href =
        finalUrl;

    }
  );

}

</script>


</body>

</html>

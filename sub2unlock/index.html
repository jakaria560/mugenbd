<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complete Steps to Unlock - MugenBD</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f5f7;
  color:#333;
}


/* ================================
   CONTAINER
================================ */

.container{
  width:100%;
  max-width:610px;
  margin:auto;
  padding:20px 9px;
}


/* ================================
   CARD
================================ */

.unlock-card{
  width:100%;
  background:#fff;
  border-radius:20px;
  padding:30px 25px 25px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
}


/* ================================
   TITLE
================================ */

.title{
  text-align:center;
  color:#173f6b;

  font-size:25px;
  font-weight:700;

  line-height:1.25;

  margin-bottom:15px;
}


/* ================================
   BADGE
================================ */

.badge{
  width:max-content;
  max-width:100%;

  margin:0 auto 30px;

  padding:8px 19px;

  border-radius:25px;

  background:#eceaff;

  color:#5650d8;

  font-size:14px;
  font-weight:700;

  text-align:center;
}


/* ================================
   STEP BUTTON
================================ */

.step-button{
  width:100%;
  height:58px;

  border:0;
  border-radius:17px;

  display:flex;
  align-items:center;

  padding:0 16px;

  color:#fff;

  font-family:Arial,Helvetica,sans-serif;

  font-size:16px;
  font-weight:700;

  cursor:pointer;

  margin-bottom:17px;

  box-shadow:0 5px 14px rgba(0,0,0,.06);

  transition:
    transform .15s,
    opacity .2s;
}

.step-button:active{
  transform:scale(.985);
}

.youtube-button{
  background:#ff2028;
}

.telegram-button{
  background:#269ed1;
}


/* ================================
   STEP ICON
================================ */

.step-icon{
  width:29px;
  min-width:29px;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:18px;
}

.step-text{
  flex:1;
  text-align:center;
  padding:0 5px;
}

.step-arrow{
  width:25px;
  min-width:25px;

  text-align:right;

  font-size:26px;
  font-weight:400;
}


/* ================================
   COMPLETED
================================ */

.step-button.completed{
  opacity:.72;
}

.step-button.completed .step-arrow{
  font-size:19px;
}


/* ================================
   STATUS
================================ */

.status{
  text-align:center;

  font-size:16px;
  font-weight:700;

  color:#555;

  margin-top:27px;
  margin-bottom:12px;
}


/* ================================
   PROGRESS
================================ */

.progress-container{
  width:100%;
  height:7px;

  background:#e1e7ed;

  border-radius:20px;

  overflow:hidden;

  margin-bottom:27px;
}

.progress-bar{
  width:0%;
  height:100%;

  border-radius:20px;

  background:linear-gradient(
    90deg,
    #b778ef,
    #8eb5f3
  );

  transition:width .4s ease;
}


/* ================================
   GET LINK
================================ */

.get-link{
  width:100%;
  height:58px;

  border:0;
  border-radius:17px;

  display:flex;
  align-items:center;

  padding:0 16px;

  background:linear-gradient(
    90deg,
    #c99cf1,
    #8fb7f3
  );

  color:#fff;

  font-family:Arial,Helvetica,sans-serif;

  font-size:16px;
  font-weight:700;

  cursor:not-allowed;

  opacity:.55;

  box-shadow:0 5px 14px rgba(145,130,220,.08);

  transition:
    opacity .25s,
    transform .15s;
}

.get-link.unlocked{
  opacity:1;
  cursor:pointer;

  background:linear-gradient(
    90deg,
    #a86de0,
    #6f9ee8
  );

  box-shadow:0 5px 15px rgba(100,90,190,.18);
}

.get-link.unlocked:active{
  transform:scale(.985);
}

.get-icon{
  width:29px;
  min-width:29px;

  font-size:18px;

  display:flex;
  justify-content:center;
}

.get-text{
  flex:1;
  text-align:center;
}

.get-arrow{
  width:25px;
  min-width:25px;

  text-align:right;

  font-size:26px;
  font-weight:400;
}


/* ================================
   SHARE BOX
================================ */

.share-box{
  margin-top:40px;

  padding:19px 16px;

  background:#f8f9fb;

  border-radius:14px;
}

.share-title{
  text-align:center;

  color:#9b52df;

  font-size:15px;
  font-weight:700;

  margin-bottom:11px;
}

.share-input{
  width:100%;

  height:48px;

  border:1px solid #dfe4e8;

  border-radius:10px;

  background:#fff;

  padding:0 12px;

  color:#5d6670;

  font-family:Arial,Helvetica,sans-serif;

  font-size:12px;

  outline:none;
}


/* ================================
   MESSAGE
================================ */

.message{
  display:none;

  text-align:center;

  margin-top:12px;

  color:#777;

  font-size:12px;
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

  .container{
    padding:15px 7px;
  }

  .unlock-card{
    border-radius:18px;
    padding:27px 19px 22px;
  }

  .title{
    font-size:23px;
    margin-bottom:13px;
  }

  .badge{
    font-size:13px;
    padding:7px 16px;
    margin-bottom:27px;
  }

  .step-button{
    height:54px;
    border-radius:16px;
    padding:0 14px;

    font-size:15px;

    margin-bottom:15px;
  }

  .step-icon{
    width:27px;
    min-width:27px;
    font-size:17px;
  }

  .step-arrow{
    width:23px;
    min-width:23px;
    font-size:24px;
  }

  .status{
    font-size:15px;
    margin-top:24px;
    margin-bottom:11px;
  }

  .progress-container{
    height:6px;
    margin-bottom:25px;
  }

  .get-link{
    height:54px;
    border-radius:16px;
    padding:0 14px;
    font-size:15px;
  }

  .get-icon{
    width:27px;
    min-width:27px;
    font-size:17px;
  }

  .get-arrow{
    width:23px;
    min-width:23px;
    font-size:24px;
  }

  .share-box{
    margin-top:35px;
    padding:18px 14px;
  }

  .share-title{
    font-size:14px;
  }

  .share-input{
    height:46px;
    font-size:12px;
  }

}


/* ================================
   VERY SMALL PHONES
================================ */

@media(max-width:380px){

  .unlock-card{
    padding:25px 16px 20px;
  }

  .title{
    font-size:21px;
  }

  .badge{
    font-size:12px;
    padding:6px 14px;
  }

  .step-button{
    height:51px;
    font-size:14px;
  }

  .get-link{
    height:51px;
    font-size:14px;
  }

}

</style>

</head>


<body>

<div class="container">

<div class="unlock-card">


<h1 class="title">
Complete Steps to Unlock
</h1>


<div class="badge">
COMPLETE THE STEPS BELOW
</div>


<!-- YOUTUBE -->

<button
id="youtubeBtn"
class="step-button youtube-button"
type="button"
>

<span class="step-icon">▶</span>

<span class="step-text">
Subscribe Channel
</span>

<span class="step-arrow">→</span>

</button>


<!-- TELEGRAM -->

<button
id="telegramBtn"
class="step-button telegram-button"
type="button"
>

<span class="step-icon">➤</span>

<span class="step-text">
Join Telegram
</span>

<span class="step-arrow">→</span>

</button>


<!-- STATUS -->

<div
id="status"
class="status"
>
Steps Completed 0/2
</div>


<!-- PROGRESS -->

<div class="progress-container">

<div
id="progressBar"
class="progress-bar"
></div>

</div>


<!-- GET LINK -->

<button
id="getLink"
class="get-link"
type="button"
>

<span class="get-icon">
🔗
</span>

<span class="get-text">
Get Your Link
</span>

<span class="get-arrow">
→
</span>

</button>


<!-- SHARE -->

<div class="share-box">

<div class="share-title">
↗ Copy Url To Share This Page
</div>

<input
id="shareUrl"
class="share-input"
type="text"
readonly
>

</div>


<div
id="message"
class="message"
></div>


</div>

</div>


<script>


/* ================================
   ELEMENTS
================================ */

const youtubeBtn =
document.getElementById("youtubeBtn");

const telegramBtn =
document.getElementById("telegramBtn");

const getLink =
document.getElementById("getLink");

const statusText =
document.getElementById("status");

const progressBar =
document.getElementById("progressBar");

const shareUrl =
document.getElementById("shareUrl");

const message =
document.getElementById("message");


/* ================================
   DATA
================================ */

let youtubeLink = "";
let telegramLink = "";
let destinationLink = "";

let youtubeCompleted = false;
let telegramCompleted = false;


/* ================================
   DECODE DATA
================================ */

function decodeData(encoded){

try{

const binary =
atob(encoded);

const bytes =
new Uint8Array(binary.length);

for(
let i=0;
i<binary.length;
i++
){

bytes[i] =
binary.charCodeAt(i);

}

const json =
new TextDecoder().decode(bytes);

return JSON.parse(json);

}catch(error){

return null;

}

}


/* ================================
   LOAD DATA
================================ */

function loadData(){

const params =
new URLSearchParams(
window.location.search
);

const encoded =
params.get("data");

if(!encoded){

message.textContent =
"Invalid unlock link.";

message.style.display =
"block";

return false;

}


const data =
decodeData(encoded);


if(
!data ||
!data.youtube ||
!data.telegram ||
!data.destination
){

message.textContent =
"This unlock link is invalid or incomplete.";

message.style.display =
"block";

return false;

}


youtubeLink =
data.youtube;

telegramLink =
data.telegram;

destinationLink =
data.destination;

return true;

}


/* ================================
   UPDATE PROGRESS
================================ */

function updateProgress(){

let completed = 0;

if(youtubeCompleted){
completed++;
}

if(telegramCompleted){
completed++;
}


statusText.textContent =
"Steps Completed " +
completed +
"/2";


progressBar.style.width =
(completed * 50) +
"%";


if(completed === 2){

getLink.classList.add(
"unlocked"
);

}else{

getLink.classList.remove(
"unlocked"
);

}

}


/* ================================
   YOUTUBE
================================ */

youtubeBtn.addEventListener(
"click",
function(){

if(youtubeCompleted){
return;
}

window.open(
youtubeLink,
"_blank",
"noopener,noreferrer"
);

youtubeCompleted =
true;

youtubeBtn.classList.add(
"completed"
);

youtubeBtn.querySelector(
".step-arrow"
).textContent = "✓";

updateProgress();

}
);


/* ================================
   TELEGRAM
================================ */

telegramBtn.addEventListener(
"click",
function(){

if(telegramCompleted){
return;
}

window.open(
telegramLink,
"_blank",
"noopener,noreferrer"
);

telegramCompleted =
true;

telegramBtn.classList.add(
"completed"
);

telegramBtn.querySelector(
".step-arrow"
).textContent = "✓";

updateProgress();

}
);


/* ================================
   GET LINK
================================ */

getLink.addEventListener(
"click",
function(){

if(
!youtubeCompleted ||
!telegramCompleted
){

return;

}

if(!destinationLink){
return;
}

window.open(
destinationLink,
"_blank",
"noopener,noreferrer"
);

}
);


/* ================================
   SHARE URL
================================ */

shareUrl.value =
window.location.href;


/* ================================
   START
================================ */

loadData();

updateProgress();

</script>

</body>

</html>
